name: CD - Astro Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - news-publication-refresh
  schedule:
    - cron: '17 * * * *'

# Sets permissions missed by the web GUI
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-news-pages-deploy
  cancel-in-progress: true


jobs:
  build:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Build static website
        run: |
          npm ci
          npm run build
        env:
          CI: true
          NODE_ENV: production
          MS_NEWS_PUBLIC_API_BASE_URL: ${{ vars.MS_NEWS_PUBLIC_API_BASE_URL }}
          PUBLIC_LIVEOPS_CONFIG_BASE_URL: ${{ vars.PUBLIC_LIVEOPS_CONFIG_BASE_URL }}
      
      - name: Log build directory as a sanity check
        run: find -maxdepth 2 -type d -name 'dist'

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload Astro build folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
